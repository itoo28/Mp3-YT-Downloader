<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Downloader</title>
  <script>
    // Inisialisasi tema sebelum render untuk mencegah efek flicker
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-gray-950 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="border-b border-slate-200 dark:border-gray-800/60 bg-white/70 dark:bg-gray-950/70 backdrop-blur sticky top-0 z-10 transition-colors duration-200">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-red-600 text-white rounded-xl w-10 h-10 flex items-center justify-center font-bold text-lg shadow-lg shadow-red-600/20">▶</div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">YouTube to MP3</h1>
          <p class="text-xs text-slate-500 dark:text-gray-400">Download audio YouTube ke format MP3 — lokal &amp; cepat</p>
        </div>
      </div>

      <!-- Theme Toggle Button -->
      <button onclick="toggleTheme()" id="themeToggle"
        class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-300 dark:border-gray-800 bg-white hover:bg-slate-100 dark:bg-gray-900 dark:hover:bg-gray-800 text-slate-700 dark:text-gray-200 transition-all shadow-sm active:scale-95"
        title="Ganti Tema (Dark / Light)">
        <span id="themeIcon" class="text-sm">🌙</span>
        <span id="themeLabel">Dark Mode</span>
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">

    <!-- Tab Navigation -->
    <div class="flex gap-1 bg-slate-200/80 dark:bg-gray-900 border border-slate-300/60 dark:border-gray-800/80 rounded-xl p-1 mb-8 transition-colors duration-200">
      <button onclick="switchTab('single')" id="tab-single"
        class="tab-btn flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all active-tab">
        🎵 Single Download
      </button>
      <button onclick="switchTab('batch')" id="tab-batch"
        class="tab-btn flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all">
        📦 Batch Download
      </button>
    </div>

    <!-- ═══════════ SINGLE TAB ═══════════ -->
    <section id="panel-single">

      <!-- URL Input -->
      <div class="bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-2xl p-6 space-y-4 shadow-sm dark:shadow-none transition-colors duration-200">
        <label class="text-sm font-semibold text-slate-700 dark:text-gray-300">Link Video YouTube</label>
        <div class="flex gap-2">
          <input type="text" id="singleUrl" placeholder="https://www.youtube.com/watch?v=..."
            class="flex-1 bg-slate-50 dark:bg-gray-950 border border-slate-300 dark:border-gray-800 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-red-500/60 focus:ring-1 focus:ring-red-500/30 transition placeholder:text-slate-400 dark:placeholder:text-gray-600">
          <button onclick="fetchInfo()" id="btnInfo"
            class="bg-slate-100 hover:bg-slate-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-slate-700 dark:text-gray-200 border border-slate-300 dark:border-transparent px-4 py-3 rounded-xl text-sm font-medium transition whitespace-nowrap shadow-sm">
            Cek Info
          </button>
        </div>
      </div>

      <!-- Video Info Preview -->
      <div id="infoCard" class="hidden mt-4 bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-2xl overflow-hidden shadow-sm dark:shadow-none transition-colors duration-200">
        <div class="flex flex-col sm:flex-row">
          <img id="infoThumb" src="" alt="thumbnail" class="w-full sm:w-48 h-32 object-cover bg-slate-100 dark:bg-gray-800">
          <div class="p-4 flex-1 space-y-1">
            <h3 id="infoTitle" class="font-semibold text-sm leading-snug line-clamp-2 text-slate-900 dark:text-white"></h3>
            <p id="infoChannel" class="text-xs text-slate-500 dark:text-gray-400"></p>
            <p id="infoDuration" class="text-xs text-slate-500 dark:text-gray-400"></p>
          </div>
        </div>

        <div class="border-t border-slate-200 dark:border-gray-800 p-4 flex flex-col sm:flex-row gap-3 items-center">
          <div class="flex items-center gap-2 flex-1">
            <label class="text-xs text-slate-600 dark:text-gray-400 whitespace-nowrap font-medium">Kualitas Audio:</label>
            <select id="singleQuality" class="bg-slate-50 dark:bg-gray-950 border border-slate-300 dark:border-gray-700 text-slate-900 dark:text-white rounded-lg px-3 py-1.5 text-sm focus:outline-none">
              <option value="128">128 kbps</option>
              <option value="192" selected>192 kbps (Standar)</option>
              <option value="320">320 kbps (Tinggi)</option>
            </select>
          </div>
          <button onclick="startSingleDownload()" id="btnSingleDl"
            class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-red-600/20 whitespace-nowrap">
            ⬇ Download MP3
          </button>
        </div>
      </div>

      <!-- Single Download Progress -->
      <div id="singleProgress" class="hidden mt-4 bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-2xl p-5 space-y-3 shadow-sm dark:shadow-none transition-colors duration-200">
        <div class="flex items-center justify-between">
          <p id="singleStage" class="text-sm font-medium text-slate-700 dark:text-gray-300">Memulai...</p>
          <span id="singlePercent" class="text-sm font-mono text-red-500 dark:text-red-400 font-semibold">0%</span>
        </div>
        <div class="w-full bg-slate-100 dark:bg-gray-800 rounded-full h-2.5 overflow-hidden border border-slate-200 dark:border-transparent">
          <div id="singleBar" class="progress-bar bg-gradient-to-r from-red-600 to-red-400 h-full rounded-full" style="width:0%"></div>
        </div>
      </div>

      <!-- Single Download Result -->
      <div id="singleResult" class="hidden mt-4 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/50 rounded-2xl p-5 shadow-sm">
        <div class="flex items-center gap-3">
          <span class="text-2xl">✅</span>
          <div class="flex-1">
            <p class="text-sm font-semibold text-emerald-800 dark:text-emerald-300">Konversi selesai!</p>
            <p id="singleResultTitle" class="text-xs text-slate-600 dark:text-gray-400 mt-0.5"></p>
          </div>
          <a id="singleResultLink" href="#" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
            Unduh
          </a>
        </div>
      </div>

      <!-- Single Error -->
      <div id="singleError" class="hidden mt-4 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800/50 rounded-2xl p-5 shadow-sm">
        <div class="flex items-center gap-3">
          <span class="text-2xl">❌</span>
          <p id="singleErrorMsg" class="text-sm text-red-800 dark:text-red-300 flex-1"></p>
        </div>
      </div>

    </section>

    <!-- ═══════════ BATCH TAB ═══════════ -->
    <section id="panel-batch" class="hidden">

      <div class="bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-2xl p-6 space-y-4 shadow-sm dark:shadow-none transition-colors duration-200">
        <label class="text-sm font-semibold text-slate-700 dark:text-gray-300">Masukkan Banyak Link YouTube (satu per baris)</label>
        <textarea id="batchUrls" rows="6" placeholder="https://www.youtube.com/watch?v=aaa&#10;https://www.youtube.com/watch?v=bbb&#10;https://www.youtube.com/watch?v=ccc"
          class="w-full bg-slate-50 dark:bg-gray-950 border border-slate-300 dark:border-gray-800 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-red-500/60 focus:ring-1 focus:ring-red-500/30 transition placeholder:text-slate-400 dark:placeholder:text-gray-600 resize-y font-mono leading-relaxed"></textarea>

        <div class="flex flex-col sm:flex-row gap-3 items-center">
          <div class="flex items-center gap-2 flex-1">
            <label class="text-xs text-slate-600 dark:text-gray-400 whitespace-nowrap font-medium">Kualitas:</label>
            <select id="batchQuality" class="bg-slate-50 dark:bg-gray-950 border border-slate-300 dark:border-gray-700 text-slate-900 dark:text-white rounded-lg px-3 py-1.5 text-sm focus:outline-none">
              <option value="128">128 kbps</option>
              <option value="192" selected>192 kbps</option>
              <option value="320">320 kbps</option>
            </select>
          </div>
          <div class="flex gap-2">
            <button onclick="startBatchDownload()" id="btnBatchDl"
              class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-red-600/20">
              📦 Mulai Antrean
            </button>
          </div>
        </div>
      </div>

      <!-- Batch Queue Status Cards -->
      <div id="batchQueue" class="hidden mt-6 space-y-3"></div>

      <!-- Batch Complete Actions -->
      <div id="batchActions" class="hidden mt-6 bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-2xl p-5 space-y-3 shadow-sm dark:shadow-none transition-colors duration-200">
        <p class="text-sm font-semibold text-emerald-600 dark:text-emerald-400">✅ Antrean selesai diproses!</p>
        <div class="flex flex-wrap gap-2">
          <button onclick="downloadZip()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
            📦 Download Semua (.ZIP)
          </button>
          <button onclick="openFolder()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-white dark:border-transparent px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
            📁 Buka Folder di Explorer
          </button>
        </div>
      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 dark:border-gray-800/40 mt-12 transition-colors duration-200">
    <div class="max-w-3xl mx-auto px-4 py-4 text-center text-xs text-slate-500 dark:text-gray-500">
      Aplikasi lokal — hanya untuk penggunaan pribadi &amp; konten berlisensi. Dibuat dengan Node.js &amp; yt-dlp.
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
