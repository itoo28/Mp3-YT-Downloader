<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-gray-800/60">
    <div class="max-w-3xl mx-auto px-4 py-5 flex items-center gap-3">
      <div class="bg-red-600 text-white rounded-xl w-10 h-10 flex items-center justify-center font-bold text-lg shadow-lg shadow-red-600/20">▶</div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">YouTube to MP3</h1>
        <p class="text-xs text-gray-500">Download audio YouTube ke format MP3 — lokal &amp; cepat</p>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">

    <!-- Tab Navigation -->
    <div class="flex gap-1 bg-gray-900 rounded-xl p-1 mb-8">
      <button onclick="switchTab('single')" id="tab-single"
        class="tab-btn flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all active-tab">
        🎵 Single Download
      </button>
      <button onclick="switchTab('batch')" id="tab-batch"
        class="tab-btn flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all">
        📦 Batch Download
      </button>
    </div>

    <!-- ═══════════ SINGLE TAB ═══════════ -->
    <section id="panel-single">

      <!-- URL Input -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4">
        <label class="text-sm font-medium text-gray-400">Link Video YouTube</label>
        <div class="flex gap-2">
          <input type="text" id="singleUrl" placeholder="https://www.youtube.com/watch?v=..."
            class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500/60 focus:ring-1 focus:ring-red-500/30 transition placeholder:text-gray-600">
          <button onclick="fetchInfo()" id="btnInfo"
            class="bg-gray-800 hover:bg-gray-700 px-4 py-3 rounded-xl text-sm font-medium transition whitespace-nowrap">
            Cek Info
          </button>
        </div>
      </div>

      <!-- Video Info Preview -->
      <div id="infoCard" class="hidden mt-4 bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
        <div class="flex flex-col sm:flex-row">
          <img id="infoThumb" src="" alt="thumbnail" class="w-full sm:w-48 h-32 object-cover bg-gray-800">
          <div class="p-4 flex-1 space-y-1">
            <h3 id="infoTitle" class="font-semibold text-sm leading-snug line-clamp-2"></h3>
            <p id="infoChannel" class="text-xs text-gray-500"></p>
            <p id="infoDuration" class="text-xs text-gray-500"></p>
          </div>
        </div>

        <div class="border-t border-gray-800 p-4 flex flex-col sm:flex-row gap-3 items-center">
          <div class="flex items-center gap-2 flex-1">
            <label class="text-xs text-gray-500 whitespace-nowrap">Kualitas Audio:</label>
            <select id="singleQuality" class="bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
              <option value="128">128 kbps</option>
              <option value="192" selected>192 kbps (Standar)</option>
              <option value="320">320 kbps (Tinggi)</option>
            </select>
          </div>
          <button onclick="startSingleDownload()" id="btnSingleDl"
            class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-red-600/20 whitespace-nowrap">
            ⬇ Download MP3
          </button>
        </div>
      </div>

      <!-- Single Download Progress -->
      <div id="singleProgress" class="hidden mt-4 bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-3">
        <div class="flex items-center justify-between">
          <p id="singleStage" class="text-sm text-gray-300">Memulai...</p>
          <span id="singlePercent" class="text-sm font-mono text-red-400">0%</span>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden">
          <div id="singleBar" class="progress-bar bg-gradient-to-r from-red-600 to-red-400 h-full rounded-full" style="width:0%"></div>
        </div>
      </div>

      <!-- Single Download Result -->
      <div id="singleResult" class="hidden mt-4 bg-emerald-950/40 border border-emerald-800/50 rounded-2xl p-5">
        <div class="flex items-center gap-3">
          <span class="text-2xl">✅</span>
          <div class="flex-1">
            <p class="text-sm font-medium text-emerald-300">Konversi selesai!</p>
            <p id="singleResultTitle" class="text-xs text-gray-400 mt-0.5"></p>
          </div>
          <a id="singleResultLink" href="#" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg text-sm font-medium transition">
            Unduh
          </a>
        </div>
      </div>

      <!-- Single Error -->
      <div id="singleError" class="hidden mt-4 bg-red-950/40 border border-red-800/50 rounded-2xl p-5">
        <div class="flex items-center gap-3">
          <span class="text-2xl">❌</span>
          <p id="singleErrorMsg" class="text-sm text-red-300 flex-1"></p>
        </div>
      </div>

    </section>

    <!-- ═══════════ BATCH TAB ═══════════ -->
    <section id="panel-batch" class="hidden">

      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4">
        <label class="text-sm font-medium text-gray-400">Masukkan Banyak Link YouTube (satu per baris)</label>
        <textarea id="batchUrls" rows="6" placeholder="https://www.youtube.com/watch?v=aaa&#10;https://www.youtube.com/watch?v=bbb&#10;https://www.youtube.com/watch?v=ccc"
          class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500/60 focus:ring-1 focus:ring-red-500/30 transition placeholder:text-gray-600 resize-y font-mono leading-relaxed"></textarea>

        <div class="flex flex-col sm:flex-row gap-3 items-center">
          <div class="flex items-center gap-2 flex-1">
            <label class="text-xs text-gray-500 whitespace-nowrap">Kualitas:</label>
            <select id="batchQuality" class="bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
              <option value="128">128 kbps</option>
              <option value="192" selected>192 kbps</option>
              <option value="320">320 kbps</option>
            </select>
          </div>
          <div class="flex gap-2">
            <button onclick="startBatchDownload()" id="btnBatchDl"
              class="bg-red-600 hover:bg-red-700 px-6 py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-red-600/20">
              📦 Mulai Antrean
            </button>
          </div>
        </div>
      </div>

      <!-- Batch Queue Status Cards -->
      <div id="batchQueue" class="hidden mt-6 space-y-3"></div>

      <!-- Batch Complete Actions -->
      <div id="batchActions" class="hidden mt-6 bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-3">
        <p class="text-sm font-semibold text-emerald-400">✅ Antrean selesai diproses!</p>
        <div class="flex flex-wrap gap-2">
          <button onclick="downloadZip()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg text-sm font-medium transition">
            📦 Download Semua (.ZIP)
          </button>
          <button onclick="openFolder()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm font-medium transition">
            📁 Buka Folder di Explorer
          </button>
        </div>
      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-800/40 mt-12">
    <div class="max-w-3xl mx-auto px-4 py-4 text-center text-xs text-gray-600">
      Aplikasi lokal — hanya untuk penggunaan pribadi & konten berlisensi. Dibuat dengan Node.js &amp; yt-dlp.
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
